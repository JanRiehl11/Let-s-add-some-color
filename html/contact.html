<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="../styles.css" rel="stylesheet" type="text/css" />
</head>
<body>
<form action="https://janriehl11.github.io/Let-s-add-some-color/html/submit.html" method="post">
 <fieldset>
    <legend>Contact me</legend>

    <input type="email" name="Email" placeholder="Email" required>
    
    <input type="text" name="Naam" minlength="2" placeholder="Naam" required>
    
    <input type="number" name="Leeftijd" min="12" placeholder="Leeftijd" required>
    
    <input type="text" name="Subject" placeholder="Subject" required>
    
    <input type="submit" value="Send">
 </fieldset>
</form>
</body>
</html>
